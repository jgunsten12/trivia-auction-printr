<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Label Printer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d0f12;
            --bg-surface: #161a1f;
            --bg-elevated: #1e2328;
            --border: #2a3038;
            --text-primary: #f0f2f5;
            --text-secondary: #8b929c;
            --text-muted: #5c6370;
            --accent: #2776EA;
            --accent-dim: #1e5fbd;
            --success: #4ade80;
            --danger: #ef4444;
            --printed-bg: #1a1d20;
            --printed-text: #4a5058;
        }

        /* Light mode */
        :root.light {
            --bg-deep: #f5f5f7;
            --bg-surface: #ffffff;
            --bg-elevated: #f0f0f2;
            --border: #d1d5db;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent: #2776EA;
            --accent-dim: #1e5fbd;
            --success: #22c55e;
            --danger: #dc2626;
            --printed-bg: #e5e7eb;
            --printed-text: #9ca3af;
        }

        :root.light body::before {
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(39, 118, 234, 0.1), transparent),
                radial-gradient(circle at 20% 80%, rgba(39, 118, 234, 0.05), transparent 40%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(39, 118, 234, 0.08), transparent),
                radial-gradient(circle at 20% 80%, rgba(39, 118, 234, 0.03), transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .header-actions {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 0.5rem;
        }

        .theme-toggle {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            transition: all 0.15s ease;
        }

        .theme-toggle:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
        }

        .theme-toggle .sun-icon { display: none; }
        .theme-toggle .moon-icon { display: block; }
        .theme-toggle .light-label { display: none; }
        .theme-toggle .dark-label { display: inline; }
        
        :root.light .theme-toggle .sun-icon { display: block; }
        :root.light .theme-toggle .moon-icon { display: none; }
        :root.light .theme-toggle .light-label { display: inline; }

        .settings-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.15s ease;
        }

        .settings-btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-body {
            padding: 1.25rem;
        }

        .settings-section {
            margin-bottom: 1.5rem;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .settings-section h4 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .settings-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .settings-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .settings-actions .btn {
            justify-content: center;
        }
        :root.light .theme-toggle .dark-label { display: none; }

        h1 {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 380px;
            gap: 1.5rem;
            align-items: start;
        }

        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .panel-title {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1.35rem;
            font-weight: 400;
        }

        .panel-actions {
            display: flex;
            gap: 0.5rem;
        }

        .panel-body {
            padding: 1rem;
            max-height: 75vh;
            overflow-y: auto;
        }

        .panel-body::-webkit-scrollbar {
            width: 6px;
        }

        .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-deep);
        }

        .btn-primary:hover {
            background: var(--accent-dim);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            padding: 0.4rem;
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            background: var(--bg-elevated);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .btn-large {
            padding: 1rem 2rem;
            font-size: 1rem;
            width: 100%;
            justify-content: center;
        }

        /* File upload */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: rgba(39, 118, 234, 0.05);
        }

        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(39, 118, 234, 0.1);
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .upload-text strong {
            color: var(--accent);
        }

        /* List items */
        .list-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: var(--bg-elevated);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 2px solid transparent;
        }

        .list-item:hover {
            background: var(--border);
        }

        .list-item.selected {
            border-color: var(--accent);
            background: rgba(39, 118, 234, 0.1);
        }

        .list-item.printed {
            opacity: 0.5;
            background: var(--printed-bg);
        }

        .list-item.printed .item-name,
        .list-item.printed .item-details {
            color: var(--printed-text);
            text-decoration: line-through;
        }

        .item-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }

        .list-item.selected .item-checkbox {
            background: var(--accent);
            border-color: var(--accent);
        }

        .item-checkbox svg {
            width: 12px;
            height: 12px;
            opacity: 0;
            color: var(--bg-deep);
        }

        .list-item.selected .item-checkbox svg {
            opacity: 1;
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-details {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .item-actions {
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .list-item:hover .item-actions {
            opacity: 1;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: var(--success);
            color: var(--bg-deep);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Print panel */
        .print-panel {
            position: sticky;
            top: 2rem;
        }

        .selection-summary {
            padding: 1rem;
            background: var(--bg-elevated);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .selection-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }

        .selection-value {
            font-size: 1rem;
            color: var(--text-primary);
        }

        .selection-value.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        .selected-packages {
            margin-top: 1rem;
        }

        .selected-package-tag {
            display: inline-block;
            background: var(--accent);
            color: var(--bg-deep);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            margin: 0.25rem 0.25rem 0 0;
        }

        /* Label preview */
        .label-preview-container {
            margin: 1rem 0;
        }

        .label-preview {
            width: 100%;
            aspect-ratio: 2.25 / 1.25;
            background: white;
            border-radius: 4px;
            padding: 12px;
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .label-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 4px 12px;
            margin-bottom: 4px;
        }

        .label-name {
            font-size: 14px;
            font-weight: 600;
        }

        .label-table {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
        }

        .label-packages {
            font-size: 10px;
            line-height: 1.3;
        }

        .label-divider {
            height: 1px;
            background: #ddd;
            margin: 6px 0;
        }

        .label-total {
            font-size: 9px;
            font-weight: 600;
            color: #666;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Inline editing */
        .editable-input {
            background: transparent;
            border: none;
            color: inherit;
            font: inherit;
            width: 100%;
            padding: 0;
        }

        .editable-input:focus {
            outline: none;
            background: var(--bg-deep);
            padding: 0.25rem 0.5rem;
            margin: -0.25rem -0.5rem;
            border-radius: 4px;
        }

        /* Add form */
        .add-form {
            display: none;
            padding: 1rem;
            background: var(--bg-elevated);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .add-form.active {
            display: block;
        }

        .form-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .form-input {
            flex: 1;
            padding: 0.6rem 0.8rem;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        /* Search box */
        .search-box {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 2rem 0.6rem 2.25rem;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-clear {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .search-clear:hover {
            color: var(--text-primary);
            background: var(--bg-elevated);
        }

        .search-clear.visible {
            display: flex;
        }

        /* Print styles */
        @media print {
            * {
                margin: 0 !important;
                padding: 0 !important;
                box-sizing: border-box !important;
            }

            html, body {
                width: 2.25in !important;
                height: 1.25in !important;
                background: white !important;
            }

            body::before {
                display: none !important;
            }

            .container {
                display: none !important;
            }

            #printArea {
                display: block !important;
                width: 2.25in !important;
                height: 1.25in !important;
                padding: 0.1in 0.1in 0.1in 0.15in !important;
                background: white !important;
                color: black !important;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
            }

            .print-label-content {
                width: 100% !important;
                height: 100% !important;
            }

            .print-label-header {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: space-between !important;
                align-items: baseline !important;
                gap: 2pt 8pt !important;
                margin-bottom: 3pt !important;
            }

            .print-label-name {
                font-size: 12pt !important;
                font-weight: bold !important;
            }

            .print-label-table {
                font-size: 9pt !important;
                color: #333 !important;
                white-space: nowrap !important;
            }

            .print-label-divider {
                border-top: 0.5pt solid #ccc !important;
                margin: 4pt 0 !important;
            }

            .print-label-packages {
                font-size: 8pt !important;
                line-height: 1.3 !important;
            }

            .print-label-total {
                font-size: 7pt !important;
                font-weight: 600 !important;
                color: #333 !important;
                margin-top: 4pt !important;
                text-transform: uppercase !important;
                letter-spacing: 0.05em !important;
            }

            @page {
                size: 2.25in 1.25in;
                margin: 0;
            }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
            }

            .print-panel {
                grid-column: span 2;
                position: static;
            }
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .print-panel {
                grid-column: span 1;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .list-item {
            animation: fadeIn 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-actions">
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">
                    <svg class="sun-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <svg class="moon-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <span class="light-label">Light</span>
                    <span class="dark-label">Dark</span>
                </button>
                <button class="settings-btn" onclick="toggleSettingsModal()" title="Settings">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
                </button>
            </div>
            <h1>Auction <span>Label</span> Printer</h1>
        </header>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal" onclick="if(event.target === this) toggleSettingsModal()">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Settings</h3>
                    <button class="btn btn-ghost" onclick="toggleSettingsModal()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h4>Data Management</h4>
                        <p class="settings-description">Clear all data from the system. This action cannot be undone.</p>
                        <div class="settings-actions">
                            <button class="btn btn-danger" onclick="clearAllAttendees()">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                Clear All Attendees
                            </button>
                            <button class="btn btn-danger" onclick="clearAllPackages()">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                Clear All Auction Items
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <!-- Attendees Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Attendees</h2>
                    <div class="panel-actions">
                        <button class="btn btn-ghost" onclick="toggleAddAttendee()" title="Add attendee">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                        <label class="btn btn-secondary">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                            Upload CSV
                            <input type="file" accept=".csv" onchange="uploadAttendees(this)" hidden>
                        </label>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input type="text" class="search-input" id="attendeeSearch" placeholder="Search attendees..." oninput="renderAttendees(); updateClearButton('attendeeSearch')">
                        <button class="search-clear" id="attendeeSearchClear" onclick="clearSearch('attendeeSearch'); renderAttendees()">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div id="addAttendeeForm" class="add-form">
                        <div class="form-row">
                            <input type="text" class="form-input" id="newFirstName" placeholder="First name">
                            <input type="text" class="form-input" id="newLastName" placeholder="Last name">
                        </div>
                        <div class="form-row">
                            <input type="text" class="form-input" id="newTableNumber" placeholder="Table #">
                            <button class="btn btn-primary" onclick="addAttendee()">Add</button>
                            <button class="btn btn-secondary" onclick="toggleAddAttendee()">Cancel</button>
                        </div>
                    </div>
                    <div id="attendeesList"></div>
                </div>
            </div>

            <!-- Packages Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Auction Packages</h2>
                    <div class="panel-actions">
                        <button class="btn btn-ghost" onclick="toggleAddPackage()" title="Add package">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                        <label class="btn btn-secondary">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                            Upload CSV
                            <input type="file" accept=".csv" onchange="uploadPackages(this)" hidden>
                        </label>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input type="text" class="search-input" id="packageSearch" placeholder="Search packages..." oninput="renderPackages(); updateClearButton('packageSearch')">
                        <button class="search-clear" id="packageSearchClear" onclick="clearSearch('packageSearch'); renderPackages()">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div id="addPackageForm" class="add-form">
                        <div class="form-row">
                            <input type="text" class="form-input" id="newPackageName" placeholder="Package name">
                            <button class="btn btn-primary" onclick="addPackage()">Add</button>
                            <button class="btn btn-secondary" onclick="toggleAddPackage()">Cancel</button>
                        </div>
                    </div>
                    <div id="packagesList"></div>
                </div>
            </div>

            <!-- Print Panel -->
            <div class="panel print-panel">
                <div class="panel-header">
                    <h2 class="panel-title">Print Label</h2>
                </div>
                <div class="panel-body">
                    <div class="selection-summary">
                        <div class="selection-label">Winner</div>
                        <div class="selection-value" id="selectedAttendeeName">
                            <span class="empty">Select an attendee</span>
                        </div>
                        <div id="selectedAttendeeTable" style="display: none;">
                            <div class="selection-label" style="margin-top: 0.75rem;">Table</div>
                            <div class="selection-value" id="selectedAttendeeTableValue"></div>
                        </div>
                        <div class="selected-packages" id="selectedPackagesArea" style="display: none;">
                            <div class="selection-label">Packages Won</div>
                            <div id="selectedPackagesList"></div>
                        </div>
                    </div>

                    <div class="label-preview-container" id="labelPreviewContainer" style="display: none;">
                        <div class="selection-label">Label Preview (2¼" × 1¼")</div>
                        <div class="label-preview" id="labelPreview"></div>
                    </div>

                    <button class="btn btn-primary btn-large" onclick="printLabel()" id="printButton" disabled>
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
                        Print Label
                    </button>

                    <button class="btn btn-secondary btn-large" onclick="clearSelection()" style="margin-top: 0.5rem;">
                        Clear Selection
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden print area -->
    <div id="printArea" style="display: none;"></div>

    <script>
        let state = {
            attendees: [],
            packages: [],
            selectedAttendee: null,
            selectedPackages: []
        };

        // Load initial data
        async function loadData() {
            const response = await fetch('/api/data');
            const data = await response.json();
            state.attendees = data.attendees || [];
            state.packages = data.packages || [];
            renderAll();
        }

        function renderAll() {
            renderAttendees();
            renderPackages();
            updatePrintPanel();
        }

        // Attendees
        function renderAttendees() {
            const container = document.getElementById('attendeesList');
            const searchInput = document.getElementById('attendeeSearch');
            const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';
            
            if (state.attendees.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👥</div>
                        <p>No attendees yet</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">Upload a CSV or add manually</p>
                    </div>
                `;
                return;
            }

            // Filter by search query
            let filteredAttendees = state.attendees;
            if (searchQuery) {
                filteredAttendees = state.attendees.filter(a => {
                    const fullName = `${a.firstName} ${a.lastName}`.toLowerCase();
                    const reverseName = `${a.lastName} ${a.firstName}`.toLowerCase();
                    const table = (a.tableNumber || '').toLowerCase();
                    return fullName.includes(searchQuery) || reverseName.includes(searchQuery) || table.includes(searchQuery);
                });
            }

            // Sort: non-printed first, then alphabetically by last name, then first name
            const sortedAttendees = [...filteredAttendees].sort((a, b) => {
                if (a.printed !== b.printed) return a.printed ? 1 : -1;
                const lastNameCompare = (a.lastName || '').localeCompare(b.lastName || '');
                if (lastNameCompare !== 0) return lastNameCompare;
                return (a.firstName || '').localeCompare(b.firstName || '');
            });

            if (sortedAttendees.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>No matches found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sortedAttendees.map(a => `
                <div class="list-item ${a.printed ? 'printed' : ''} ${state.selectedAttendee?.id === a.id ? 'selected' : ''}" 
                     onclick="selectAttendee(${a.id})" data-id="${a.id}">
                    <div class="item-checkbox">
                        <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                    </div>
                    <div class="item-content">
                        <div class="item-name">${escapeHtml(a.firstName)} ${escapeHtml(a.lastName)}</div>
                        <div class="item-details">Table ${escapeHtml(a.tableNumber)}</div>
                    </div>
                    ${a.printed ? '<span class="status-badge">Printed</span>' : ''}
                    <div class="item-actions">
                        ${a.printed ? `<button class="btn btn-ghost" onclick="event.stopPropagation(); resetStatus('attendee', ${a.id})" title="Reset status">↺</button>` : ''}
                        <button class="btn btn-ghost" onclick="event.stopPropagation(); deleteAttendee(${a.id})" title="Delete">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function selectAttendee(id) {
            const attendee = state.attendees.find(a => a.id === id);
            if (state.selectedAttendee?.id === id) {
                state.selectedAttendee = null;
            } else {
                state.selectedAttendee = attendee;
            }
            renderAttendees();
            updatePrintPanel();
        }

        async function uploadAttendees(input) {
            if (!input.files[0]) return;
            
            const formData = new FormData();
            formData.append('file', input.files[0]);
            
            const response = await fetch('/api/attendees', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            state.attendees = data.data.attendees;
            state.selectedAttendee = null;
            renderAll();
            input.value = '';
        }

        function toggleAddAttendee() {
            document.getElementById('addAttendeeForm').classList.toggle('active');
        }

        async function addAttendee() {
            const firstName = document.getElementById('newFirstName').value.trim();
            const lastName = document.getElementById('newLastName').value.trim();
            const tableNumber = document.getElementById('newTableNumber').value.trim();
            
            if (!firstName || !lastName) return;
            
            const response = await fetch('/api/attendees/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName, lastName, tableNumber })
            });
            
            const data = await response.json();
            state.attendees = data.data.attendees;
            renderAll();
            
            document.getElementById('newFirstName').value = '';
            document.getElementById('newLastName').value = '';
            document.getElementById('newTableNumber').value = '';
            toggleAddAttendee();
        }

        async function deleteAttendee(id) {
            if (!confirm('Delete this attendee?')) return;
            
            const response = await fetch(`/api/attendees/${id}`, { method: 'DELETE' });
            const data = await response.json();
            state.attendees = data.data.attendees;
            
            if (state.selectedAttendee?.id === id) {
                state.selectedAttendee = null;
            }
            renderAll();
        }

        // Packages
        function renderPackages() {
            const container = document.getElementById('packagesList');
            const searchInput = document.getElementById('packageSearch');
            const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';
            
            if (state.packages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎁</div>
                        <p>No packages yet</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">Upload a CSV or add manually</p>
                    </div>
                `;
                return;
            }

            // Filter by search query
            let filteredPackages = state.packages;
            if (searchQuery) {
                filteredPackages = state.packages.filter(p => {
                    return (p.name || '').toLowerCase().includes(searchQuery);
                });
            }

            // Sort: non-printed first, then alphabetically by name
            const sortedPackages = [...filteredPackages].sort((a, b) => {
                if (a.printed !== b.printed) return a.printed ? 1 : -1;
                return (a.name || '').localeCompare(b.name || '');
            });

            if (sortedPackages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>No matches found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sortedPackages.map(p => `
                <div class="list-item ${p.printed ? 'printed' : ''} ${state.selectedPackages.some(sp => sp.id === p.id) ? 'selected' : ''}" 
                     onclick="togglePackage(${p.id})" data-id="${p.id}">
                    <div class="item-checkbox">
                        <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                    </div>
                    <div class="item-content">
                        <div class="item-name">${escapeHtml(p.name)}</div>
                    </div>
                    ${p.printed ? '<span class="status-badge">Printed</span>' : ''}
                    <div class="item-actions">
                        ${p.printed ? `<button class="btn btn-ghost" onclick="event.stopPropagation(); resetStatus('package', ${p.id})" title="Reset status">↺</button>` : ''}
                        <button class="btn btn-ghost" onclick="event.stopPropagation(); deletePackage(${p.id})" title="Delete">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function togglePackage(id) {
            const pkg = state.packages.find(p => p.id === id);
            const idx = state.selectedPackages.findIndex(p => p.id === id);
            
            if (idx >= 0) {
                state.selectedPackages.splice(idx, 1);
            } else {
                state.selectedPackages.push(pkg);
            }
            
            renderPackages();
            updatePrintPanel();
        }

        async function uploadPackages(input) {
            if (!input.files[0]) return;
            
            const formData = new FormData();
            formData.append('file', input.files[0]);
            
            const response = await fetch('/api/packages', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            state.packages = data.data.packages;
            state.selectedPackages = [];
            renderAll();
            input.value = '';
        }

        function toggleAddPackage() {
            document.getElementById('addPackageForm').classList.toggle('active');
        }

        async function addPackage() {
            const name = document.getElementById('newPackageName').value.trim();
            if (!name) return;
            
            const response = await fetch('/api/packages/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            
            const data = await response.json();
            state.packages = data.data.packages;
            renderAll();
            
            document.getElementById('newPackageName').value = '';
            toggleAddPackage();
        }

        async function deletePackage(id) {
            if (!confirm('Delete this package?')) return;
            
            const response = await fetch(`/api/packages/${id}`, { method: 'DELETE' });
            const data = await response.json();
            state.packages = data.data.packages;
            state.selectedPackages = state.selectedPackages.filter(p => p.id !== id);
            renderAll();
        }

        // Print panel
        function updatePrintPanel() {
            const nameEl = document.getElementById('selectedAttendeeName');
            const tableArea = document.getElementById('selectedAttendeeTable');
            const tableEl = document.getElementById('selectedAttendeeTableValue');
            const packagesArea = document.getElementById('selectedPackagesArea');
            const packagesList = document.getElementById('selectedPackagesList');
            const previewContainer = document.getElementById('labelPreviewContainer');
            const preview = document.getElementById('labelPreview');
            const printBtn = document.getElementById('printButton');

            if (state.selectedAttendee) {
                nameEl.innerHTML = `${escapeHtml(state.selectedAttendee.firstName)} ${escapeHtml(state.selectedAttendee.lastName)}`;
                tableArea.style.display = 'block';
                tableEl.textContent = state.selectedAttendee.tableNumber || 'N/A';
            } else {
                nameEl.innerHTML = '<span class="empty">Select an attendee</span>';
                tableArea.style.display = 'none';
            }

            if (state.selectedPackages.length > 0) {
                packagesArea.style.display = 'block';
                packagesList.innerHTML = state.selectedPackages.map(p => 
                    `<span class="selected-package-tag">${escapeHtml(p.name)}</span>`
                ).join('');
            } else {
                packagesArea.style.display = 'none';
            }

            // Update preview
            if (state.selectedAttendee && state.selectedPackages.length > 0) {
                previewContainer.style.display = 'block';
                const packageGroups = splitPackagesForLabels(state.selectedPackages);
                const totalLabels = packageGroups.length;
                const totalItems = state.selectedPackages.length;
                const labelNumber = totalLabels > 1 ? ` (1/${totalLabels})` : '';
                const firstGroupText = packageGroups[0].map(p => escapeHtml(p.name)).join(' | ');
                
                preview.innerHTML = `
                    <div class="label-header">
                        <div class="label-name">${escapeHtml(state.selectedAttendee.firstName)} ${escapeHtml(state.selectedAttendee.lastName)}${labelNumber}</div>
                        <div class="label-table">Table ${escapeHtml(state.selectedAttendee.tableNumber || 'N/A')}</div>
                    </div>
                    <div class="label-divider"></div>
                    <div class="label-packages">${firstGroupText}</div>
                    ${totalLabels === 1 ? `<div class="label-total">TOTAL ITEMS: ${totalItems}</div>` : ''}
                `;
                
                // Update button text to show label count
                printBtn.innerHTML = totalLabels > 1 
                    ? `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg> Print ${totalLabels} Labels`
                    : `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg> Print Label`;
                printBtn.disabled = false;
            } else {
                previewContainer.style.display = 'none';
                printBtn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg> Print Label`;
                printBtn.disabled = true;
            }
        }

        // Split packages into groups that fit on labels
        function splitPackagesForLabels(packages, maxChars = 80) {
            const groups = [];
            let currentGroup = [];
            let currentLength = 0;
            
            for (const pkg of packages) {
                const pkgLength = pkg.name.length + 3; // +3 for " | " separator
                
                if (currentLength + pkgLength > maxChars && currentGroup.length > 0) {
                    groups.push(currentGroup);
                    currentGroup = [pkg];
                    currentLength = pkg.name.length;
                } else {
                    currentGroup.push(pkg);
                    currentLength += pkgLength;
                }
            }
            
            if (currentGroup.length > 0) {
                groups.push(currentGroup);
            }
            
            return groups;
        }

        async function printLabel() {
            if (!state.selectedAttendee || state.selectedPackages.length === 0) return;

            const printArea = document.getElementById('printArea');
            const name = `${escapeHtml(state.selectedAttendee.firstName)} ${escapeHtml(state.selectedAttendee.lastName)}`;
            const table = escapeHtml(state.selectedAttendee.tableNumber || 'N/A');
            
            // Split packages into groups that fit on labels
            const packageGroups = splitPackagesForLabels(state.selectedPackages);
            const totalLabels = packageGroups.length;
            
            // Print each label
            for (let i = 0; i < packageGroups.length; i++) {
                const group = packageGroups[i];
                const packageText = group.map(p => escapeHtml(p.name)).join(' | ');
                const labelNumber = totalLabels > 1 ? ` (${i + 1}/${totalLabels})` : '';
                
                const totalItems = state.selectedPackages.length;
                const isLastLabel = i === packageGroups.length - 1;
                printArea.style.display = 'block';
                printArea.innerHTML = `
                    <div class="print-label-content">
                        <div class="print-label-header">
                            <div class="print-label-name">${name}${labelNumber}</div>
                            <div class="print-label-table">Table ${table}</div>
                        </div>
                        <div class="print-label-divider"></div>
                        <div class="print-label-packages">${packageText}</div>
                        ${isLastLabel ? `<div class="print-label-total">TOTAL ITEMS: ${totalItems}</div>` : ''}
                    </div>
                `;

                // Trigger print
                window.print();
                
                // Small delay between prints if multiple labels
                if (i < packageGroups.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }

            // Mark as printed
            const response = await fetch('/api/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    attendeeId: state.selectedAttendee.id,
                    packageIds: state.selectedPackages.map(p => p.id)
                })
            });

            const data = await response.json();
            state.attendees = data.data.attendees;
            state.packages = data.data.packages;
            
            // Clear selection after printing
            clearSelection();
            
            printArea.style.display = 'none';
        }

        function clearSelection() {
            state.selectedAttendee = null;
            state.selectedPackages = [];
            renderAll();
        }

        async function resetStatus(type, id) {
            const response = await fetch('/api/reset-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, id })
            });
            
            const data = await response.json();
            state.attendees = data.data.attendees;
            state.packages = data.data.packages;
            renderAll();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                clearSelection();
            }
            if (e.key === 'p' && e.metaKey) {
                e.preventDefault();
                printLabel();
            }
        });

        // Search helpers
        function clearSearch(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.value = '';
                updateClearButton(inputId);
            }
        }

        function updateClearButton(inputId) {
            const input = document.getElementById(inputId);
            const clearBtn = document.getElementById(inputId + 'Clear');
            if (input && clearBtn) {
                if (input.value.length > 0) {
                    clearBtn.classList.add('visible');
                } else {
                    clearBtn.classList.remove('visible');
                }
            }
        }

        // Settings modal
        function toggleSettingsModal() {
            document.getElementById('settingsModal').classList.toggle('active');
        }

        async function clearAllAttendees() {
            if (!confirm('Are you sure you want to delete ALL attendees? This cannot be undone.')) return;
            
            const response = await fetch('/api/attendees/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            const data = await response.json();
            state.attendees = data.data.attendees;
            state.selectedAttendee = null;
            renderAll();
            toggleSettingsModal();
        }

        async function clearAllPackages() {
            if (!confirm('Are you sure you want to delete ALL auction items? This cannot be undone.')) return;
            
            const response = await fetch('/api/packages/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            const data = await response.json();
            state.packages = data.data.packages;
            state.selectedPackages = [];
            renderAll();
            toggleSettingsModal();
        }

        // Theme toggle
        function toggleTheme() {
            document.documentElement.classList.toggle('light');
            const isLight = document.documentElement.classList.contains('light');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light');
            }
        }

        // Initialize
        initTheme();
        loadData();
    </script>
</body>
</html>
